spring:
  application:
    name: notification-service
  config:
    import: classpath:events-kafka.yaml
  datasource:
    url: jdbc:postgresql://${NOTIFICATION_DB_HOST:localhost}:${NOTIFICATION_DB_PORT:5432}/${NOTIFICATION_DB_NAME:notification}
    username: ${NOTIFICATION_DB_USER:notification}
    password: ${NOTIFICATION_DB_PASSWORD}
  kafka:
    bootstrap-servers: localhost:29092
    listener:
      observation-enabled: true
    template:
      observation-enabled: true
    consumer:
      group-id: notification-service
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        spring.kafka.listener: true
        spring.kafka.template: true

app:
  notification:
    rules:
      bulk-movement:
        threshold: 500
  kafka:
    topics:
      auto-create: true
