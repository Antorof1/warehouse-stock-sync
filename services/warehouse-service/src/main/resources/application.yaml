spring:
  application:
    name: warehouse-service
  config:
    import: classpath:events-kafka.yaml
  datasource:
    url: jdbc:postgresql://${WAREHOUSE_DB_HOST:localhost}:${WAREHOUSE_DB_PORT:5432}/${WAREHOUSE_DB_NAME:warehouse}
    username: ${WAREHOUSE_DB_USER:warehouse}
    password: ${WAREHOUSE_DB_PASSWORD}
  kafka:
    bootstrap-servers: localhost:29092
    producer:
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

app:
  outbox:
    retention: P7D
    sweep-interval: PT1H
  kafka:
    topics:
      auto-create: true
