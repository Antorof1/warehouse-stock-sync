spring:
  application:
    name: warehouse-service
  config:
    import: classpath:events-kafka.yaml
  datasource:
    url: jdbc:postgresql://${WAREHOUSE_DB_HOST:localhost}:${WAREHOUSE_DB_PORT:5432}/${WAREHOUSE_DB_NAME:warehouse}
    username: ${WAREHOUSE_DB_USER:warehouse}
    password: ${WAREHOUSE_DB_PASSWORD}
  kafka:
    bootstrap-servers: localhost:29092
    listener:
      observation-enabled: true
    template:
      observation-enabled: true
    producer:
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        spring.kafka.listener: true
        spring.kafka.template: true

app:
  kafka:
    topics:
      auto-create: true
