spring:
  application:
    name: reorder-service
  datasource:
    url: jdbc:postgresql://${REORDER_DB_HOST:localhost}:${REORDER_DB_PORT:5432}/${REORDER_DB_NAME:reorder}
    username: ${REORDER_DB_USER:reorder}
    password: ${REORDER_DB_PASSWORD}
  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: reorder-service
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: com.github.antorof1.events
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer

app:
  purchase-orders:
    ttl: P7D
    sweep-interval: PT1H
  kafka:
    topics:
      auto-create: true
