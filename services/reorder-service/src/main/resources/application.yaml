spring:
  application:
    name: reorder-service
  config:
    import: classpath:events-kafka.yaml
  datasource:
    url: jdbc:postgresql://${REORDER_DB_HOST:localhost}:${REORDER_DB_PORT:5432}/${REORDER_DB_NAME:reorder}
    username: ${REORDER_DB_USER:reorder}
    password: ${REORDER_DB_PASSWORD}
  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: reorder-service
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
    producer:
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

app:
  purchase-orders:
    ttl: P7D
    sweep-interval: PT1H
  kafka:
    topics:
      auto-create: true
