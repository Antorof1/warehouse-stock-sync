spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:postgresql://${INVENTORY_DB_HOST:localhost}:${INVENTORY_DB_PORT:5432}/${INVENTORY_DB_NAME:inventory}
    username: ${INVENTORY_DB_USER:inventory}
    password: ${INVENTORY_DB_PASSWORD}
  kafka:
    bootstrap-servers: localhost:29092
    consumer:
      group-id: inventory-service
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: com.github.antorof1.events
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer

app:
  kafka:
    topics:
      auto-create: true
