services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      SERVICE_DATABASES: warehouse inventory reorder notification
      WAREHOUSE_DB_NAME: ${WAREHOUSE_DB_NAME}
      WAREHOUSE_DB_USER: ${WAREHOUSE_DB_USER}
      WAREHOUSE_DB_PASSWORD: ${WAREHOUSE_DB_PASSWORD}
      INVENTORY_DB_NAME: ${INVENTORY_DB_NAME}
      INVENTORY_DB_USER: ${INVENTORY_DB_USER}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
      REORDER_DB_NAME: ${REORDER_DB_NAME}
      REORDER_DB_USER: ${REORDER_DB_USER}
      REORDER_DB_PASSWORD: ${REORDER_DB_PASSWORD}
      NOTIFICATION_DB_NAME: ${NOTIFICATION_DB_NAME}
      NOTIFICATION_DB_USER: ${NOTIFICATION_DB_USER}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - 5432:5432

  kafka:
    image: apache/kafka-native:4.3.1
    user: root
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_BOOTSTRAP_SERVERS: CONTROLLER:9093
      KAFKA_LISTENERS: BROKER://0.0.0.0:9092,HOST://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: BROKER:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      KAFKA_ADVERTISED_LISTENERS: BROKER://kafka:9092,HOST://localhost:29092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka
    ports:
      - 29092:29092

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - 8090:8080

  warehouse-service:
    profiles: [ "full" ]
    build:
      context: .
      dockerfile: services/warehouse-service/Dockerfile
    depends_on:
      - postgres
      - kafka
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${WAREHOUSE_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${WAREHOUSE_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${WAREHOUSE_DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "${WAREHOUSE_PORT:-8081}:8080"

  inventory-service:
    profiles: [ "full" ]
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    depends_on:
      - postgres
      - kafka
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${INVENTORY_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${INVENTORY_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${INVENTORY_DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "${INVENTORY_PORT:-8082}:8080"

  reorder-service:
    profiles: [ "full" ]
    build:
      context: .
      dockerfile: services/reorder-service/Dockerfile
    depends_on:
      - postgres
      - kafka
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${REORDER_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${REORDER_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${REORDER_DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "${REORDER_PORT:-8083}:8080"

  notification-service:
    profiles: [ "full" ]
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    depends_on:
      - postgres
      - kafka
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${NOTIFICATION_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${NOTIFICATION_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "${NOTIFICATION_PORT:-8084}:8080"

  simulator:
    profiles: [ "full" ]
    build:
      context: .
      dockerfile: services/simulator/Dockerfile
    depends_on:
      - kafka
      - warehouse-service
      - reorder-service
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_SERVICES_WAREHOUSE: http://warehouse-service:8080
      APP_SERVICES_INVENTORY: http://inventory-service:8080
      APP_SERVICES_REORDER: http://reorder-service:8080
      APP_SERVICES_NOTIFICATION: http://notification-service:8080
      GRAFANA_PORT: ${GRAFANA_PORT:-3000}
      WAREHOUSE_PORT: ${WAREHOUSE_PORT:-8081}
      REORDER_PORT: ${REORDER_PORT:-8083}
    ports:
      - "${SIMULATOR_PORT:-8085}:8080"

  prometheus:
    profiles: [ "full" ]
    image: prom/prometheus:v3.5.0
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    profiles: [ "full" ]
    image: grafana/grafana:12.1.0
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/warehouse-stock-sync.json
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"

volumes:
  postgres_data:
  kafka_data:
  prometheus_data:
  grafana_data:
